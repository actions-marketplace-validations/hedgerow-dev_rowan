# Go Security Rules
rules:

  - id: GO-INJECT-001
    name: os/exec command injection
    severity: high
    category: command_injection
    cwe: [78]
    languages: [go]
    patterns:
      - 'exec\.Command\s*\('
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      exec.Command() with user-controlled arguments leads to arbitrary command
      execution. Use .arg() with separate arguments, never shell strings.

  - id: GO-INJECT-002
    name: SQL injection via fmt.Sprintf
    severity: high
    category: injection
    cwe: [89]
    languages: [go]
    patterns:
      - '\.(Query|Exec)\(\s*fmt\.Sprintf\s*\('
      - '\.(Query|Exec)\(\s*[`"](?:SELECT|INSERT|UPDATE|DELETE)\b[^)]*\+'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      SQL query built with fmt.Sprintf() is vulnerable to SQL injection.
      Use $1, $2 placeholders with parameterized queries.

  - id: GO-XSS-001
    name: Unescaped template type
    severity: high
    category: xss
    cwe: [79]
    languages: [go]
    patterns:
      - 'template\.(HTML|JS|CSS|URL|HTMLAttr)\s*\('
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      Unescaped template type marks content as safe. XSS if content is
      user-controlled. Use html/template automatic escaping.

  - id: GO-CRYPTO-001
    name: Weak crypto import
    severity: medium
    category: crypto
    cwe: [328]
    languages: [go]
    patterns:
      - '"crypto/md5"'
      - '"crypto/sha1"'
      - '"crypto/des"'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      Deprecated/weak crypto package imported. Use crypto/sha256 or
      crypto/aes (GCM mode) instead.

  - id: GO-CRYPTO-002
    name: math/rand for security
    severity: medium
    category: crypto
    cwe: [330]
    languages: [go]
    patterns:
      - '"math/rand"'
    pattern-not:
      - '"crypto/rand"'
      - '(?m)^\s*//.*'
    message: |
      math/rand is not cryptographically secure. Use crypto/rand for
      tokens, keys, and security-sensitive random values.

  - id: GO-SSRF-001
    name: Unvalidated HTTP client
    severity: high
    category: ssrf
    cwe: [918]
    languages: [go]
    patterns:
      - 'http\.(Get|Post|PostForm|NewRequest)\s*\('
    pattern-not:
      - 'context\.'
      - '\.WithContext\s*\('
      - '(?m)^\s*//.*'
    message: |
      HTTP client without request validation enables SSRF. Validate and
      whitelist destination URLs before making outbound requests.

  - id: GO-PATH-001
    name: User-controlled file path
    severity: high
    category: path_traversal
    cwe: [22]
    languages: [go]
    patterns:
      - 'os\.(Open|OpenFile)\s*\('
      - 'ioutil\.ReadFile\s*\('
    pattern-not:
      - 'filepath\.Clean\s*\('
      - 'filepath\.Abs\s*\('
      - '(?m)^\s*//.*'
    message: |
      Filesystem path from user input allows directory traversal. Use
      filepath.Clean() and validate the resolved path.

  - id: GO-SSTI-001
    name: text/template used for HTML
    severity: medium
    category: ssti
    cwe: [94]
    languages: [go]
    patterns:
      - '"text/template"'
    pattern-not:
      - '"html/template"'
      - '(?m)^\s*//.*'
    message: |
      text/template used for HTML rendering: no automatic XSS escaping.
      Use html/template for HTML contexts.

  - id: GO-CONFIG-001
    name: TLS verification disabled
    severity: high
    category: config
    cwe: [295]
    languages: [go]
    patterns:
      - 'InsecureSkipVerify\s*:\s*true'
    pattern-not:
      - '(?m)^\s*//.*'
    message: |
      TLS certificate verification disabled. Enables man-in-the-middle
      attacks in production. Remove InsecureSkipVerify.

  - id: GO-AUTH-001
    name: HTTP server without TLS
    severity: medium
    category: auth
    cwe: [319]
    languages: [go]
    patterns:
      - 'http\.ListenAndServe\s*\('
    pattern-not:
      - 'http\.ListenAndServeTLS\s*\('
      - '(?m)^\s*//.*'
    message: |
      HTTP server running in cleartext. Sensitive data transmitted in
      plaintext. Use ListenAndServeTLS with valid certificates.

  - id: GO-SUPPLY-001
    name: Missing response body close
    severity: low
    category: supply_chain
    cwe: [772]
    languages: [go]
    patterns:
      - '\.Do\s*\('
    pattern-not:
      - '(?i)once\.Do\s*\('
      - '(?s)\.Do\s*\(.{0,300}?defer\s+\S+\.Body\.Close\s*\(\s*\)'
      - '(?m)^\s*//.*'
    message: |
      HTTP response body not closed. Leaks connections and may exhaust
      file descriptors. Add 'defer resp.Body.Close()'.
