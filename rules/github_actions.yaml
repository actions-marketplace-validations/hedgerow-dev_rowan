# GitHub Actions CI/CD Security Rules: hardcoded secrets and workflow misconfig
rules:

  # ── Hardcoded credentials in workflow files ─────────────────────

  - id: ns-sec-001
    name: Hardcoded AWS credentials in workflow
    severity: critical
    category: secrets
    cwe: [798]
    fix: "Store the credential in GitHub Secrets and reference it as ${{ secrets.NAME }}; never commit a literal key to a workflow file."
    languages: [yaml]
    patterns:
      - 'AKIA[0-9A-Z]{16}'
      - 'aws_secret_access_key\s*:\s*["'']?[A-Za-z0-9/+=]{40}["'']?'
    pattern-not:
      - 'AKIAIOSFODNN7EXAMPLE'
      - '\$\{\{\s*secrets\.'
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      Hardcoded AWS credential in a GitHub Actions workflow file. Anyone with
      read access to the repository (or its history) can read the key.
      Move it to GitHub Secrets and reference it as ${{ secrets.NAME }}.

  - id: ns-sec-002
    name: Hardcoded platform/API token in workflow
    severity: critical
    category: secrets
    cwe: [798]
    fix: "Store the token in GitHub Secrets and reference it as ${{ secrets.NAME }}; rotate the token since it is already committed to history."
    languages: [yaml]
    patterns:
      - 'ghp_[A-Za-z0-9]{36}\b'
      - 'github_pat_[A-Za-z0-9_]{22,}'
      - 'xox[baprs]-[A-Za-z0-9-]{10,}'
      - 'AIza[0-9A-Za-z_-]{35}\b'
      - '-----BEGIN\s?(RSA|OPENSSH|EC|DSA|PGP)?\s?PRIVATE KEY-----'
    pattern-not:
      - '\$\{\{\s*secrets\.'
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      Hardcoded GitHub, Slack, Google API, or private-key credential in a
      workflow file. Anyone with read access to the repository (or its
      history) can read it. Move it to GitHub Secrets and rotate it.

  # ── Workflow structure / privilege-escalation misconfig ─────────

  - id: ns-cicd-001
    name: pull_request_target trigger used
    severity: high
    category: config
    cwe: [269]
    fix: "Prefer the pull_request trigger, which runs with no write access to secrets. If pull_request_target is required, do not check out or run the PR head's code (github.event.pull_request.head.*)."
    languages: [yaml]
    patterns:
      - '^\s*pull_request_target\s*:'
      - '^\s*-?\s*pull_request_target\s*$'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      pull_request_target runs with the base repo's secrets and write
      permissions, even for PRs from forks. If this workflow later checks
      out or runs the PR head's code, a forked PR can steal secrets or
      push using the workflow's permissions. Prefer pull_request, or make
      sure this workflow never builds/runs the PR head ref.

  - id: ns-cicd-002
    name: Third-party action pinned to a mutable ref
    severity: medium
    category: supply_chain
    cwe: [829]
    fix: "Pin the action to a full-length commit SHA (uses: owner/repo@<40-char-sha>) instead of a branch or version tag, so a compromised upstream tag can't silently change what runs in CI."
    languages: [yaml]
    patterns:
      - 'uses:\s*[\w.-]+/[\w.-]+@(main|master|latest|HEAD)\b'
      - 'uses:\s*[\w.-]+/[\w.-]+@v?[0-9]+(\.[0-9]+)?\s*$'
    pattern-not:
      - 'uses:\s*actions/[\w.-]+@[0-9a-f]{40}'
      - 'uses:\s*[\w.-]+/[\w.-]+@[0-9a-f]{40}'
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      Action referenced by a branch name or short version tag rather than a
      full commit SHA. A branch/tag can be repointed by the upstream
      maintainer (or an attacker who compromises their account) to run
      different code in your CI with access to your secrets. Pin to a
      full-length commit SHA.

  - id: ns-cicd-003
    name: Untrusted context value used in workflow
    severity: high
    category: injection
    cwe: [94]
    fix: "Never interpolate github.event.*.title/body, github.head_ref, or comment/review bodies directly into a run: script. Pass them through an env: variable instead and reference the env var from the shell, so the value is data rather than injected script text."
    languages: [yaml]
    patterns:
      - '(?m)^\s*(?:-\s*)?run:\s*[^\n]*\$\{\{[ \t]*github\.event\.(issue|pull_request)\.(title|body)[ \t]*\}\}'
      - '(?m)^\s*(?:-\s*)?run:\s*[^\n]*\$\{\{[ \t]*github\.event\.(comment|review)\.body[ \t]*\}\}'
      - '(?m)^\s*(?:-\s*)?run:\s*[^\n]*\$\{\{[ \t]*github\.head_ref[ \t]*\}\}'
      - '(?:echo\s|export\s|if\s|elif\s|\[\[|\]\]|&&|>>|\$\(|`|curl\s|wget\s|git\s|npm\s|pip\s|uv\s|docker\s|bash\s|make\s|python\s|python3\s|sed\s|awk\s|mv\s|cp\s|rm\s|cd\s|tar\s|kubectl\s|gh\s|aws\s|helm\s)[^\n]*\$\{\{\s*github\.event\.(issue|pull_request)\.(title|body)\s*\}\}'
      - '(?:echo\s|export\s|if\s|elif\s|\[\[|\]\]|&&|>>|\$\(|`|curl\s|wget\s|git\s|npm\s|pip\s|uv\s|docker\s|bash\s|make\s|python\s|python3\s|sed\s|awk\s|mv\s|cp\s|rm\s|cd\s|tar\s|kubectl\s|gh\s|aws\s|helm\s)[^\n]*\$\{\{\s*github\.head_ref\s*\}\}'
      # Shell variable assignment at line start: the common block-form `run: |` shape.
      - '^\s*[A-Za-z_][A-Za-z0-9_]*=[^\n]*\$\{\{\s*(?:github\.event\.(?:issue|pull_request)\.(?:title|body)|github\.event\.(?:comment|review)\.body|github\.head_ref)\s*\}\}'
    pattern-not:
      - '(?m)^\s*#'
      - '(?:def test_|conftest|unittest)'
    message: |
      Attacker-controlled context value (PR/issue title or body, a comment,
      or the head branch name) referenced directly in shell source. An
      attacker can craft a title/branch name containing
      shell metacharacters to inject arbitrary commands into the runner.
      Pass the value through env: and reference the environment variable
      from the shell instead of interpolating it into the script text.

  - id: ns-cicd-004
    name: "Workflow input interpolated into a run: script"
    severity: medium
    category: injection
    cwe: [94]
    fix: "Bind the input to a step-level env: variable and reference \"$VAR\" from the shell, so the value is passed as data instead of being pasted into the script text."
    languages: [yaml]
    patterns:
      - '(?m)^\s*(?:-\s*)?run:\s*[^\n]*\$\{\{[ \t]*(?:github\.event\.)?inputs\.'
      - '(?m)^\s*(?:-\s*)?run:\s*[^\n]*\$\{\{[ \t]*github\.event\.client_payload\.'
      - '(?:echo\s|export\s|if\s|elif\s|\[\[|\]\]|&&|>>|\$\(|`|curl\s|wget\s|git\s|npm\s|pip\s|uv\s|docker\s|bash\s|make\s|python\s|python3\s|sed\s|awk\s|mv\s|cp\s|rm\s|cd\s|tar\s|kubectl\s|gh\s|aws\s|helm\s)[^\n]*\$\{\{\s*(?:github\.event\.)?inputs\.'
    pattern-not:
      - '(?m)^\s*#'
    message: |
      A workflow_dispatch input or repository_dispatch payload value is
      interpolated directly into a `run:` script on this line. The expression is
      expanded into the script text before the shell parses it, so a value
      containing shell metacharacters runs as commands on the runner.

      A free-text input is not a trust boundary: anyone who can trigger the
      workflow controls it, and the job often holds more privilege than they do
      (id-token: write, publish credentials, a release environment). Git ref and
      tag names accept ;, |, &&, backticks and $(). Quoting the expression does
      not fix it, because $(...) and backticks still expand inside double
      quotes.

      Triggering `workflow_dispatch` normally requires write access, so treat
      that form as CI hardening and privilege escalation within the pipeline
      rather than unauthenticated RCE. A repository-dispatch payload can have a
      different trust boundary and must be assessed from its trigger policy.

  - id: ns-cicd-005
    name: "Pull request head ref interpolated into a run: script"
    severity: high
    category: injection
    cwe: [94]
    fix: "Bind the ref to a step-level env: variable and reference \"$HEAD_REF\" from the shell. Never paste a fork-controlled branch name into script text."
    languages: [yaml]
    patterns:
      - 'run:.*\$\{\{\s*github\.event\.pull_request\.head\.(?:ref|label)\b'
      - 'run:.*\$\{\{\s*github\.event\.workflow_run\.head_branch\b'
      - '(?:echo\s|export\s|if\s|elif\s|\[\[|\]\]|&&|>>|\$\(|`|curl\s|wget\s|git\s|npm\s|pip\s|uv\s|docker\s|bash\s|make\s|python\s|python3\s|sed\s|awk\s|mv\s|cp\s|rm\s|cd\s|tar\s|kubectl\s|gh\s|aws\s|helm\s)[^\n]*\$\{\{\s*github\.event\.pull_request\.head\.(?:ref|label)\b'
    pattern-not:
      - '(?m)^\s*#'
    message: |
      A pull request head branch name is interpolated directly into a run:
      script. Unlike a workflow input, this value needs no repository
      permission at all: anyone who can open a fork pull request chooses the
      branch name, and branch names accept shell metacharacters.

      Combined with pull_request_target or workflow_run, which run with the
      base repository's secrets, this is the standard path from an outside
      contributor to secret exfiltration. Bind the value to an env: variable
      and quote the shell reference.
