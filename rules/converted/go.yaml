rules:
- id: GO-INJECT-001
  languages:
  - go
  severity: ERROR
  message: 'exec.Command() with user-controlled arguments leads to arbitrary command

    execution. Use .arg() with separate arguments, never shell strings.'
  patterns:
  - pattern-regex: exec\.Command\s*\(
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: command_injection
    cwe:
    - 78
    original_engine: neuroscan
    rule_name: os/exec command injection
    residual:
    - sanitizer
- id: GO-INJECT-002
  languages:
  - go
  severity: ERROR
  message: 'SQL query built with fmt.Sprintf() is vulnerable to SQL injection.

    Use $1, $2 placeholders with parameterized queries.'
  patterns:
  - pattern-either:
    - pattern-regex: \.(Query|Exec)\(\s*fmt\.Sprintf\s*\(
    - pattern-regex: \.(Query|Exec)\(\s*[`"](?:SELECT|INSERT|UPDATE|DELETE)\b[^)]*\+
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: injection
    cwe:
    - 89
    original_engine: neuroscan
    rule_name: SQL injection via fmt.Sprintf
    residual:
    - sanitizer
- id: GO-XSS-001
  languages:
  - go
  severity: ERROR
  message: 'Unescaped template type marks content as safe. XSS if content is

    user-controlled. Use html/template automatic escaping.'
  patterns:
  - pattern-regex: template\.(HTML|JS|CSS|URL|HTMLAttr)\s*\(
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: xss
    cwe:
    - 79
    original_engine: neuroscan
    rule_name: Unescaped template type
    residual:
    - sanitizer
- id: GO-CRYPTO-001
  languages:
  - go
  severity: WARNING
  message: 'Deprecated/weak crypto package imported. Use crypto/sha256 or

    crypto/aes (GCM mode) instead.'
  patterns:
  - pattern-either:
    - pattern-regex: '"crypto/md5"'
    - pattern-regex: '"crypto/sha1"'
    - pattern-regex: '"crypto/des"'
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: crypto
    cwe:
    - 328
    original_engine: neuroscan
    rule_name: Weak crypto import
- id: GO-CRYPTO-002
  languages:
  - go
  severity: WARNING
  message: 'math/rand is not cryptographically secure. Use crypto/rand for

    tokens, keys, and security-sensitive random values.'
  patterns:
  - pattern-regex: '"math/rand"'
  - pattern-not-regex: '"crypto/rand"'
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: crypto
    cwe:
    - 330
    original_engine: neuroscan
    rule_name: math/rand for security
- id: GO-SSRF-001
  languages:
  - go
  severity: ERROR
  message: 'HTTP client without request validation enables SSRF. Validate and

    whitelist destination URLs before making outbound requests.'
  patterns:
  - pattern-regex: http\.(Get|Post|PostForm|NewRequest)\s*\(
  - pattern-not-regex: context\.
  - pattern-not-regex: \.WithContext\s*\(
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: ssrf
    cwe:
    - 918
    original_engine: neuroscan
    rule_name: Unvalidated HTTP client
    residual:
    - sanitizer
- id: GO-PATH-001
  languages:
  - go
  severity: ERROR
  message: 'Filesystem path from user input allows directory traversal. Use

    filepath.Clean() and validate the resolved path.'
  patterns:
  - pattern-either:
    - pattern-regex: os\.(Open|OpenFile)\s*\(
    - pattern-regex: ioutil\.ReadFile\s*\(
  - pattern-not-regex: filepath\.Clean\s*\(
  - pattern-not-regex: filepath\.Abs\s*\(
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: path_traversal
    cwe:
    - 22
    original_engine: neuroscan
    rule_name: User-controlled file path
    residual:
    - sanitizer
- id: GO-SSTI-001
  languages:
  - go
  severity: WARNING
  message: 'text/template used for HTML rendering: no automatic XSS escaping.

    Use html/template for HTML contexts.'
  patterns:
  - pattern-regex: '"text/template"'
  - pattern-not-regex: '"html/template"'
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: ssti
    cwe:
    - 94
    original_engine: neuroscan
    rule_name: text/template used for HTML
    residual:
    - sanitizer
- id: GO-CONFIG-001
  languages:
  - go
  severity: ERROR
  message: 'TLS certificate verification disabled. Enables man-in-the-middle

    attacks in production. Remove InsecureSkipVerify.'
  patterns:
  - pattern-regex: InsecureSkipVerify\s*:\s*true
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: config
    cwe:
    - 295
    original_engine: neuroscan
    rule_name: TLS verification disabled
- id: GO-AUTH-001
  languages:
  - go
  severity: WARNING
  message: 'HTTP server running in cleartext. Sensitive data transmitted in

    plaintext. Use ListenAndServeTLS with valid certificates.'
  patterns:
  - pattern-regex: http\.ListenAndServe\s*\(
  - pattern-not-regex: http\.ListenAndServeTLS\s*\(
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: auth
    cwe:
    - 319
    original_engine: neuroscan
    rule_name: HTTP server without TLS
- id: GO-SUPPLY-001
  languages:
  - go
  severity: INFO
  message: 'HTTP response body not closed. Leaks connections and may exhaust

    file descriptors. Add ''defer resp.Body.Close()''.'
  patterns:
  - pattern-regex: \.Do\s*\(
  - pattern-not-regex: (?i)once\.Do\s*\(
  - pattern-not-regex: (?s)\.Do\s*\(.{0,300}?defer\s+\S+\.Body\.Close\s*\(\s*\)
  - pattern-not-regex: (?m)^\s*//.*
  metadata:
    category: supply_chain
    cwe:
    - 772
    original_engine: neuroscan
    original_severity: low
    rule_name: Missing response body close
