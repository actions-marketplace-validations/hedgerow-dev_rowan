decoys:
  - id: PYD-01
    resembles: "PY-11 (smolagents local executor)"
    why_safe: "build_sandboxed_agent() sets executor_type=\"e2b\", so model-written code runs in a remote E2B sandbox, not on the host"
    location: {file: app/smol.py, symbol: build_sandboxed_agent}
    expected_rule_ids: [tnt-py-ai-localexec-001]

  - id: PYD-02
    resembles: "PY-26 (LangGraph shell node without a checkpoint)"
    why_safe: "build_reviewed_graph() routes plan -> confirm -> run, and confirm_deploy() calls interrupt() and clears the command when the human declines"
    location: {file: app/graph.py, symbol: build_reviewed_graph}
    expected_rule_ids: [tnt-py-ai-hitl-001]

  - id: PYD-03
    resembles: "PY-16 (FastMCP HTTP transport without auth)"
    why_safe: "serve_authenticated() builds FastMCP(..., auth=JWTVerifier(jwks_uri=..., issuer=..., audience=...)), so every request must carry a valid bearer token"
    location: {file: app/mcp_server.py, symbol: serve_authenticated}
    expected_rule_ids: [ns-aiml-127, MCP-HTTP-BIND-001, tnt-py-ai-mcpauth-001]

  - id: PYD-04
    resembles: "PY-14 (session store without a user scope)"
    why_safe: "ask_ops_guarded() keys SQLiteSession on f\"{user_id}:{conversation_id}\" where user_id comes from the authenticated header, so one user cannot open another's session"
    location: {file: app/openai_agents.py, symbol: ask_ops_guarded}
    expected_rule_ids: [tnt-py-ai-sessionscope-001]

  - id: PYD-05
    resembles: "PY-01 (function_tool parameter to shell)"
    why_safe: "run_shell_guarded() carries tool_input_guardrails=[allowlist_binary], which rejects any command whose first word is not in ALLOWED_BINARIES, and the agent has input_guardrails=[reject_destructive]"
    location: {file: app/openai_agents.py, symbol: run_shell_guarded}
    expected_rule_ids: [AGENT-TOOL-001, tnt-py-ai-hitl-001]

  - id: PYD-06
    resembles: "PY-04 (tool parameter to open())"
    why_safe: "read_note_safe() resolves the joined path and rejects it unless is_relative_to(base), the Path.resolve() + is_relative_to idiom"
    location: {file: app/pydantic_agent.py, symbol: read_note_safe}
    expected_rule_ids: [AGENT-TOOL-001, TNT-PATH-002]

  - id: PYD-07
    resembles: "PY-19 (bypassPermissions)"
    why_safe: "maintain_reviewed() uses permission_mode=\"default\" and a can_use_tool callback that denies any Bash command outside git status/log/diff"
    location: {file: app/claude_sdk.py, symbol: maintain_reviewed}
    expected_rule_ids: [tnt-py-ai-bypassperm-001]
