# Oracle (Python) -- planted-vulnerability ground truth (PY-02, benchmark answer key).
#
# Schema follows Langfail's benchmarks/ground_truth.yaml: meta, vulnerabilities with
# id/title/cwe/tier/exploitable/source/sink/taint_path/sanitizers_present/notes,
# and decoys with id/resembles/why_safe/location. Extended with
# `expected_rule_ids`: the Rowan rule id(s) that should catch each vuln, or
# fire as a false positive on each decoy. Ids that exist today are written
# as they appear in rules/ or rowan/passes/; ids named
# `tnt-py-ai-<class>-001` are PLANNED (BACKLOG.md PY-04..PY-08) and are
# expected to score MISS until the rule lands. Each planned id is marked in
# `notes`, and tests/test_benchmark_ai_apps.py holds the allow-list.
#
# This file is NOT referenced by the app source under app/ -- the app must
# contain no vuln markers, same discipline as Langfail.

meta:
  app: oracle-python
  source_dir: .
  tiers:
    1: single-file (tool parameter, LLM output or config to sink in one function)
    2: cross-function, same module (agent built in one function, privilege in another)
    3: cross-file (route -> service -> tool registration -> implementation)

vulnerabilities:
  - id: PY-01
    title: "OpenAI Agents @function_tool parameter to subprocess.run(shell=True)"
    cwe: CWE-78
    tier: 1
    exploitable: true
    source: {file: app/openai_agents.py, symbol: run_shell, note: "command (tool parameter chosen by the model)"}
    sink: {file: app/openai_agents.py, symbol: run_shell, line_hint: 33}
    taint_path:
      - "app/openai_agents.py:run_shell (command, @function_tool)"
      - "app/openai_agents.py:run_shell (subprocess.run(command, shell=True))"
    sanitizers_present: []
    expected_rule_ids: [AGENT-TOOL-001]
    notes: >
      The @function_tool decorator is not in cross_file's _TOOL_DECORATOR_NAMES
      today, so the boundary is invisible; PY-03 acceptance target.

