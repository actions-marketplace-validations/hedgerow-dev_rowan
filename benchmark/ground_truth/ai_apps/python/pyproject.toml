[project]
name = "oracle-python"
version = "0.1.0"
description = "Hedgerow oracle service: one FastAPI app wiring the current Python agent SDKs (benchmark fixture, source only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai-agents>=0.2",
    "pydantic-ai>=0.4",
    "google-adk>=1.5",
    "smolagents>=1.20",
    "langgraph>=0.5",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "fastmcp>=2.10",
    "claude-agent-sdk>=0.1",
    "semantic-kernel>=1.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
