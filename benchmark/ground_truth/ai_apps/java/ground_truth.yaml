  - id: JA-12
    title: "DB-configured value reaches StdioMcpTransport.command"
    cwe: CWE-78
    tier: 2
    exploitable: true
    source: {file: src/main/java/dev/hedgerow/oracle/mcp/McpLauncherService.java, symbol: launch, note: "McpServerEntity.command, JPA row"}
    sink: {file: src/main/java/dev/hedgerow/oracle/mcp/McpLauncherService.java, symbol: launch, line_hint: 26}
    taint_path:
      - "src/main/java/dev/hedgerow/oracle/mcp/McpServerEntity.java:getCommand (persisted column, set via an out-of-scope admin endpoint)"
      - "src/main/java/dev/hedgerow/oracle/mcp/McpLauncherService.java:launch (row = repository.findById(serverId))"
      - "src/main/java/dev/hedgerow/oracle/mcp/McpLauncherService.java:launch (StdioMcpTransport.builder().command(row.getCommand()))"
    sanitizers_present: []
    expected_rule_ids: [tnt-ja-ai-mcpcmd-002]
    notes: >
      Config/DB-sourced variant of the JG-06 mcpcmd shape (the direct
      request-parameter variant would be mcpcmd-001); the taint hop is a JPA
      round-trip rather than the current request.

  - id: JA-13
    title: "Cross-file: controller -> service -> agent -> QueryRunner (LLM SQL)"
    cwe: CWE-89
    tier: 3
    exploitable: true
    source: {file: src/main/java/dev/hedgerow/oracle/controller/ChatController.java, symbol: ask, note: "@RequestParam String q"}
    sink: {file: src/main/java/dev/hedgerow/oracle/agent/QueryRunner.java, symbol: execute, line_hint: 24}
    taint_path:
      - "src/main/java/dev/hedgerow/oracle/controller/ChatController.java:ask (q, @RequestParam)"
      - "src/main/java/dev/hedgerow/oracle/service/AssistantService.java:ask (question -> sqlAgent.run(question))"
      - "src/main/java/dev/hedgerow/oracle/agent/SqlAgent.java:run (sql <- chatClient.prompt().user(...).call().content())"
      - "src/main/java/dev/hedgerow/oracle/agent/QueryRunner.java:execute (jdbcTemplate.queryForList(sql))"
    sanitizers_present: []
    expected_rule_ids: [tnt-ja-ai-llmout-sql-001]
    notes: >
      DataAgent-style SqlExecuteNode -> SqlExecutor shape (BACKLOG.md JG-09
      survey). The LLM call and the sink are in different files from each
      other AND from the controller; expected MISS until JG-13 cross-file
      lands. JG-13 acceptance target.

  - id: JA-14
    title: "Cross-file: controller -> service -> agent loop -> @Tool dispatch (shell)"
    cwe: CWE-78
    tier: 3
    exploitable: true
    source: {file: src/main/java/dev/hedgerow/oracle/controller/ChatController.java, symbol: act, note: "@RequestParam String task"}
    sink: {file: src/main/java/dev/hedgerow/oracle/tool/ShellTool.java, symbol: run, line_hint: 19}
    taint_path:
      - "src/main/java/dev/hedgerow/oracle/controller/ChatController.java:act (task, @RequestParam)"
      - "src/main/java/dev/hedgerow/oracle/service/AssistantService.java:dispatch (task -> agentLoop.run(task))"
      - "src/main/java/dev/hedgerow/oracle/agent/AgentLoop.java:run (command <- chatClient.prompt().user(...).call().content())"
      - "src/main/java/dev/hedgerow/oracle/tool/ShellTool.java:run (shellTool.run(command), same sink as JA-01)"
    sanitizers_present: []
    expected_rule_ids: [tnt-ja-ai-toolexec-001]
    notes: >
      Shares its sink location with JA-01: ShellTool.run is itself a @Tool
      method, so once tnt-ja-ai-toolexec-001 exists it will likely flag this
      line on the Tier-1 (intraprocedural, @Tool-parameter) shape alone,
      independent of whether the agent-loop call path is tracked. That is a
      real and useful measurement in its own right -- it shows the
      cross-file agent-dispatch path adds no incremental recall here because
      the single-file rule already dominates this sink. JG-13's acceptance
      target is really JA-13, where the sink is NOT itself a @Tool method
      and no single-file rule can reach it.

decoys:
  - id: JD-01
    resembles: "JA-01 (@Tool -> exec)"
    why_safe: "runAction() checks the model-chosen action against a fixed allowlist before ProcessBuilder ever runs"
    location: {file: src/main/java/dev/hedgerow/oracle/tool/SafeShellTool.java, symbol: runAction}
    expected_rule_ids: [tnt-ja-ai-toolexec-001]

  - id: JD-02
    resembles: "JA-02 (@Tool -> path traversal)"
    why_safe: "readNote() resolves under NOTES_DIR and rejects any path whose normalized form escapes it via startsWith"
    location: {file: src/main/java/dev/hedgerow/oracle/tool/SafeFileTool.java, symbol: readNote}
    expected_rule_ids: [tnt-ja-ai-toolpath-001]

  - id: JD-03
    resembles: "JA-05 (LLM output -> SQLi)"
    why_safe: "askAndQuery() only ever binds the LLM's guess as a PreparedStatement parameter (?), never concatenates it into SQL text"
    location: {file: src/main/java/dev/hedgerow/oracle/llm/LlmSqlSafeService.java, symbol: askAndQuery}
    expected_rule_ids: [tnt-ja-ai-llmout-sql-001]

  - id: JD-04
    resembles: "JA-10 (unsafe YAML)"
    why_safe: "loadConfig() constructs Yaml with SafeConstructor, which cannot instantiate arbitrary Java types"
    location: {file: src/main/java/dev/hedgerow/oracle/controller/YamlSafeController.java, symbol: loadConfig}
    expected_rule_ids: [tnt-ja-ai-yaml-001]
