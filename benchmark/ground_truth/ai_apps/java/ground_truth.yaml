# Oracle (Java) -- planted-vulnerability ground truth (JG-11, benchmark answer key).
#
# Schema follows Langfail's benchmarks/ground_truth.yaml: meta, vulnerabilities with
# id/title/cwe/tier/exploitable/source/sink/taint_path/sanitizers_present/notes,
# and decoys with id/resembles/why_safe/location. Extended with
# `expected_rule_ids`, the Rowan tnt-ja-ai-* rule id(s) (JG-04/05/06) that
# should catch each vuln, or fire as a false positive on each decoy.
#
# This file is NOT referenced by the app source under src/ -- the app must
# contain no vuln markers, same discipline as Langfail.

meta:
  app: oracle-java
  source_dir: .
  tiers:
    1: single-file, tool layer (@Tool parameter to sink)
    2: single-file, LLM output or request to sink
    3: cross-file (controller -> service -> agent/tool, 3-4 files)

vulnerabilities:
  - id: JA-01
    title: "@Tool parameter to ProcessBuilder"
    cwe: CWE-78
    tier: 1
    exploitable: true
    source: {file: src/main/java/dev/hedgerow/oracle/tool/ShellTool.java, symbol: run}
    sink: {file: src/main/java/dev/hedgerow/oracle/tool/ShellTool.java, symbol: run, line_hint: 19}
    taint_path:
      - src/main/java/dev/hedgerow/oracle/tool/ShellTool.java:run (command, @Tool/@ToolParam)
    sanitizers_present: []
    expected_rule_ids: [tnt-ja-ai-toolexec-001]
    notes: "Also the sink JA-14 reaches via the agent loop -- see JA-14 notes."

  - id: JA-02
    title: "@Tool parameter to Files.readString(Paths.get(...))"
    cwe: CWE-22
